<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Estudos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    h2 { margin-top: 0; font-size: 1.25rem; }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { background: #2563eb; font-weight: 600; cursor: pointer; border: none; margin-top: 16px; }
    button:hover { background: #1d4ed8; }
    .flashcard { min-height: 140px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1.1rem; cursor: pointer; background: #334155; border-radius: 8px; padding: 16px; }
    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    .btn-errar { background: #dc2626; }
    .btn-acertar { background: #16a34a; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Aquecimento: Flashcards -->
    <div class="card" id="card-area">
      <h2>Aquecimento: Revisão Espaçada</h2>
      <div id="flashcard" class="flashcard">Clique em "Iniciar" para carregar os cartões do dia</div>
      <div class="btn-group" id="card-actions" style="display: none;">
        <button class="btn-errar" onclick="responderCard(false)">Errei (Amanhã)</button>
        <button class="btn-acertar" onclick="responderCard(true)">Acertei (+Intervalo)</button>
      </div>
      <button id="btn-iniciar" onclick="carregarCards()">Iniciar Revisão</button>
    </div>

    <!-- Registo de Questões -->
    <div class="card">
      <h2>Registo da Bateria</h2>
      <input type="text" id="materia" placeholder="Matéria (ex.: Dir. Constitucional)">
      <input type="text" id="assunto" placeholder="Assunto (ex.: Direitos Fundamentais)">
      <input type="number" id="total" placeholder="Total de questões feitas">
      <input type="number" id="acertos" placeholder="Total de acertos">
      <button onclick="salvarBateria()">Salvar Bateria</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "COLE_AQUI_A_SUA_PROJECT_URL";
    const SUPABASE_KEY = "COLE_AQUI_A_SUA_PUBLISHABLE_KEY";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cards = [];
    let cardAtual = 0;
    let mostrandoVerso = false;

    async function carregarCards() {
      const hoje = new Date().toISOString().split('T')[0];
      const { data, error } = await _supabase.from('cartoes').select('*').lte('proxima_revisao', hoje);
      if (error || !data || data.length === 0) {
        document.getElementById('flashcard').innerText = "Nenhum cartão pendente para hoje!";
        return;
      }
      cards = data;
      cardAtual = 0;
      exibirCard();
    }

    function exibirCard() {
      if (cardAtual >= cards.length) {
        document.getElementById('flashcard').innerText = "Revisão concluída! Pronto para a bateria.";
        document.getElementById('card-actions').style.display = 'none';
        return;
      }
      mostrandoVerso = false;
      document.getElementById('flashcard').innerText = cards[cardAtual].frente;
      document.getElementById('flashcard').onclick = virarCard;
      document.getElementById('btn-iniciar').style.display = 'none';
      document.getElementById('card-actions').style.display = 'none';
    }

    function virarCard() {
      if (!mostrandoVerso && cards[cardAtual]) {
        document.getElementById('flashcard').innerText = cards[cardAtual].verso;
        document.getElementById('card-actions').style.display = 'flex';
        mostrandoVerso = true;
      }
    }

    async function responderCard(acertou) {
      const c = cards[cardAtual];
      let novoIntervalo = acertou ? Math.max(c.intervalo * 2, 2) : 1;
      let prox = new Date();
      prox.setDate(prox.getDate() + novoIntervalo);

      await _supabase.from('cartoes').update({
        intervalo: novoIntervalo,
        proxima_revisao: prox.toISOString().split('T')[0]
      }).eq('id', c.id);

      cardAtual++;
      exibirCard();
    }

    async function salvarBateria() {
      const materia = document.getElementById('materia').value;
      const assunto = document.getElementById('assunto').value;
      const total = parseInt(document.getElementById('total').value);
      const acertos = parseInt(document.getElementById('acertos').value);

      if (!materia || isNaN(total) || isNaN(acertos)) {
        alert("Preencha todos os campos da bateria.");
        return;
      }

      const { error } = await _supabase.from('baterias').insert([{ materia, assunto, total_questoes: total, acertos }]);
      if (error) {
        alert("Erro ao salvar: " + error.message);
      } else {
        alert("Bateria registrada com sucesso!");
        document.getElementById('total').value = '';
        document.getElementById('acertos').value = '';
      }
    }
  </script>
</body>
</html>
